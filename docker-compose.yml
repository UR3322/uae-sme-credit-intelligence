services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: uae_sme_cip
      POSTGRES_USER: bootstrap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-db.sh:/docker-entrypoint-initdb.d/000-create-app-role.sh:ro
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./backend/grant-app.sql:/docker-entrypoint-initdb.d/002-grant-app.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bootstrap -d uae_sme_cip"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ml-service:
    build: ./ml-service
    environment:
      ML_SERVICE_API_KEY: ${ML_SERVICE_API_KEY:?Set ML_SERVICE_API_KEY in .env}
    expose: ["8000"]
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 5000
      TRUST_PROXY: "true"
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: uae_sme_cip
      PGUSER: app
      PGPASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      DATABASE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ORIGINS: http://localhost:3000
      PYTHON_ML_SERVICE_URL: http://ml-service:8000
      ML_SERVICE_API_KEY: ${ML_SERVICE_API_KEY:?Set ML_SERVICE_API_KEY in .env}
    expose: ["5000"]
    depends_on:
      db:
        condition: service_healthy
      ml-service:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports: ["127.0.0.1:3000:8080"]
    depends_on: [backend]
    restart: unless-stopped

  demo-seed:
    build: ./backend
    profiles: ["demo-seed"]
    command: ["node", "seed.js"]
    environment:
      NODE_ENV: development
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: uae_sme_cip
      PGUSER: app
      PGPASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      DATABASE_SSL: "false"
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
