version: '3.8'

services:
  # 1. FastAPI ML Microservice
  ml-service:
    build: ./ml-service
    container_name: uae_sme_ml_service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000

  # 2. Node.js API Gateway
  backend:
    build: ./backend
    container_name: uae_sme_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres.vyyifzyqtijuzgvuspvb:YOUR_DB_PASSWORD@aws-0-ap-south-1.pooler.supabase.com:6543/postgres
      - JWT_SECRET=super_secret_uae_sme_cip_jwt_key_2026
      - PYTHON_ML_SERVICE_URL=http://ml-service:8000
    depends_on:
      - ml-service

  # 3. React Frontend Dashboard
  frontend:
    build: ./frontend
    container_name: uae_sme_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend